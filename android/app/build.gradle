apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// The app version comes from package.json, which release-please bumps.
def appVersionName = new groovy.json.JsonSlurper().parse(file("../../package.json")).version
def (versionMajor, versionMinor, versionPatch) = appVersionName.tokenize(".-")[0..2].collect { it as int }

react {
    autolinkLibrariesWithApp()
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.calmcontractiontimer.app"
    defaultConfig {
        applicationId "com.calmcontractiontimer.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode versionMajor * 1_000_000 + versionMinor * 1_000 + versionPatch
        versionName appVersionName
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Release signing is configured by the release workflow; see README.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    packaging {
        jniLibs {
            // Keep native libs uncompressed so they stay 16 KB page-aligned in the APK/AAB.
            useLegacyPackaging false
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
}
