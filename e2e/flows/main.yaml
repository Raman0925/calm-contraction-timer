# SPDX-License-Identifier: Apache-2.0
# Onboarding -> time three contractions -> History -> CSV export.
appId: com.calmcontractiontimer.app
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow
- tapOn: 'Next'
- tapOn: 'Next'
- assertVisible: 'Before you start'
- tapOn: 'I understand'
- repeat:
    times: 3
    commands:
      # The button is disabled while the timer loads or saves; wait until it can be pressed.
      - extendedWaitUntil:
          visible:
            text: 'Start'
            enabled: true
          timeout: 10000
      - tapOn: 'Start'
      - extendedWaitUntil:
          visible:
            text: 'Stop'
            enabled: true
          timeout: 10000
      - tapOn: 'Stop'
- extendedWaitUntil:
    visible:
      text: 'Start'
      enabled: true
    timeout: 10000
# On small screens the list sits below the fold.
- scrollUntilVisible:
    element:
      text: 'Recent contractions'
    direction: DOWN
- tapOn: 'History'
- tapOn: '.*3 contractions.*'
- assertVisible: 'Contractions'
- tapOn: 'Export this session'
- tapOn: 'Spreadsheet (CSV)'
# The Android share sheet shows either the file name or the sheet title, depending on version.
- extendedWaitUntil:
    visible: '.*(contractions-.*csv|Share contractions).*'
    timeout: 10000
- back
# Without Pro the button is labelled 'Doctor report (PDF) · Pro'.
- assertVisible: 'Doctor report \(PDF\).*'
# The PDF report is Pro: it opens the paywall, which must work even without Google Play.
- tapOn: 'Doctor report \(PDF\).*'
- assertVisible: 'Calm Contraction Timer Pro'
- tapOn: 'Not now'
- assertVisible: 'Export this session'
