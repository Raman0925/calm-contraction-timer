# SPDX-License-Identifier: Apache-2.0
# Store screenshots from the seeded history (see scripts/screenshots/capture.sh).
appId: com.calmcontractiontimer.app
---
- launchApp
# The emulator runs on UTC, where automatic night mode may already be on: start in Light.
- tapOn:
    id: 'tab-settings'
- scrollUntilVisible:
    element:
      text: 'Light'
    direction: DOWN
- tapOn: 'Light'
- tapOn:
    id: 'tab-timer'
- extendedWaitUntil:
    visible: 'Pattern matches.*'
    timeout: 15000
- takeScreenshot: 01-timer-pattern

# A contraction being timed.
- extendedWaitUntil:
    visible:
      text: 'Start'
      enabled: true
    timeout: 10000
- tapOn: 'Start'
- extendedWaitUntil:
    visible:
      id: 'live-timer'
      text: '.*: 00:4[0-9]'
    timeout: 60000
- takeScreenshot: 02-timer-contracting
# Stop after a full minute, so this contraction keeps the 5-1-1 pattern for later screens.
# Match the running timer by id: the recent list also shows times like 01:07.
# Short steps: one long wait ended early on CI, well before its timeout.
- extendedWaitUntil:
    visible:
      id: 'live-timer'
      text: '.*: 00:5[5-9]'
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: 'live-timer'
      text: '.*: 01:0[5-9]'
    timeout: 30000
- tapOn: 'Stop'

# History and a session with its charts.
- tapOn:
    id: 'tab-history'
- extendedWaitUntil:
    visible: '.*contractions · Average.*'
    timeout: 10000
- takeScreenshot: 03-history
# The newest session is listed first.
- tapOn: '.*contractions · Average.*'
- extendedWaitUntil:
    visible: 'Length of each contraction.*'
    timeout: 10000
- takeScreenshot: 04-session
- scrollUntilVisible:
    element:
      text: 'Minutes between starts'
    direction: DOWN
- takeScreenshot: 05-session-charts
# Relaunch (keeps data) rather than pressing Back, which is less predictable.
- launchApp

# The night theme for 3 AM.
- tapOn:
    id: 'tab-settings'
- scrollUntilVisible:
    element:
      text: 'Night \(true black, dim\)'
    direction: DOWN
- tapOn: 'Night \(true black, dim\)'
- tapOn:
    id: 'tab-timer'
- extendedWaitUntil:
    visible: 'Pattern matches.*'
    timeout: 10000
- takeScreenshot: 07-night
