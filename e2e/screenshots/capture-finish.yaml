# SPDX-License-Identifier: Apache-2.0
# Store screenshots, part 3, from the seeded history (see scripts/screenshots/capture.sh).
appId: com.calmcontractiontimer.app
---
# capture.sh waits until the contraction is over a minute long, so it keeps the 5-1-1
# pattern for the later screens.
- tapOn: 'Stop'

# History and a session with its charts.
- tapOn:
    id: 'tab-history'
- extendedWaitUntil:
    visible: '.*contractions · Average.*'
    timeout: 10000
- takeScreenshot: 03-history
# The newest session is listed first.
- tapOn: '.*contractions · Average.*'
- extendedWaitUntil:
    visible: 'Length of each contraction.*'
    timeout: 10000
- takeScreenshot: 04-session
# Scroll to the whole interval chart; its heading alone is already on screen.
- scrollUntilVisible:
    element:
      id: 'interval-chart'
    direction: DOWN
    centerElement: true
- takeScreenshot: 05-session-charts
# Relaunch (keeps data) rather than pressing Back, which is less predictable.
- launchApp

# The night theme for 3 AM.
- tapOn:
    id: 'tab-settings'
- scrollUntilVisible:
    element:
      text: 'Night \(true black, dim\)'
    direction: DOWN
- tapOn: 'Night \(true black, dim\)'
- tapOn:
    id: 'tab-timer'
- extendedWaitUntil:
    visible: 'Pattern matches.*'
    timeout: 10000
- takeScreenshot: 07-night
