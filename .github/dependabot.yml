version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope
    ignore:
      # Major upgrades are done by hand: the React Native template pins compatible
      # versions of Babel, Jest, TypeScript, ESLint and the CLI.
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      # These must move together; upgrade them with the React Native Upgrade Helper.
      react-native-core:
        patterns:
          - react
          - react-native
          - '@react-native/*'
          - '@react-native-community/cli*'
          - '@babel/*'
      react-navigation:
        patterns: ['@react-navigation/*']
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      # The Gradle version is set by the React Native template; bump it with React Native.
      - dependency-name: gradle-wrapper
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
