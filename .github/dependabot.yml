version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope
    groups:
      # These must move together; upgrade them with the React Native Upgrade Helper.
      react-native-core:
        patterns:
          - react
          - react-native
          - '@react-native/*'
          - '@react-native-community/cli*'
      react-navigation:
        patterns: ['@react-navigation/*']
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
