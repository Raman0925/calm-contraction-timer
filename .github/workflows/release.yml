# SPDX-License-Identifier: Apache-2.0
# Builds the signed app bundle for a version tag and attaches it, with the R8 mapping and
# native debug symbols, to the GitHub Release. Upload the bundle to Play Console by hand.
# Setup: docs/releasing.md.
#
# Two jobs keep permissions apart: "build" runs npm and Gradle code with the signing secrets
# and a read-only token; "publish" runs no project code and alone may write to the release.
name: Release

on:
  push:
    tags: ['v*']
  # Run from the tag: choose it under "Use workflow from".
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build signed bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Requires approval by a reviewer configured on the "production" environment.
    environment: production
    steps:
      - name: Only release version tags
        run: |
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Run this workflow from a version tag such as v1.2.0, not $GITHUB_REF." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - run: npm ci

      - name: Decode upload key
        env:
          CCT_UPLOAD_KEYSTORE_BASE64: ${{ secrets.CCT_UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$CCT_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build signed app bundle
        working-directory: android
        env:
          CCT_REQUIRE_UPLOAD_KEY: 'true'
          CCT_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload.jks
          CCT_UPLOAD_STORE_PASSWORD: ${{ secrets.CCT_UPLOAD_STORE_PASSWORD }}
          CCT_UPLOAD_KEY_ALIAS: ${{ secrets.CCT_UPLOAD_KEY_ALIAS }}
          CCT_UPLOAD_KEY_PASSWORD: ${{ secrets.CCT_UPLOAD_KEY_PASSWORD }}
          CCT_ADMOB_APP_ID: ${{ secrets.CCT_ADMOB_APP_ID }}
          CCT_ADMOB_BANNER_ID: ${{ secrets.CCT_ADMOB_BANNER_ID }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Remove upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Check 16 KB page alignment (all ABIs)
        run: bash scripts/check-16kb.sh android/app/build/outputs/bundle/release/app-release.aab

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/mapping/release/mapping.txt
            android/app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Attach to the GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: release

      - name: Attach bundle, mapping and debug symbols
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp release/bundle/release/app-release.aab "calm-contraction-timer-$TAG.aab"
          cp release/mapping/release/mapping.txt "mapping-$TAG.txt"
          cp release/native-debug-symbols/release/native-debug-symbols.zip "native-debug-symbols-$TAG.zip"
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes
          gh release upload "$TAG" "calm-contraction-timer-$TAG.aab" "mapping-$TAG.txt" "native-debug-symbols-$TAG.zip" --clobber
